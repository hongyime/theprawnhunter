use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

search:
  formats:
    - html
    - json
  safe_search: 0

server:
  limiter: false
  public_instance: false

# Engine selection is driven by what actually answers from this host
# (verified 2026-10-27). Brave/DDG/Google/Qwant/Startpage/Bing/Yahoo are
# captcha- or 429-blocked, so they are disabled instead of timing out.
engines:
  - name: yandex
    disabled: false
  - name: baidu
    disabled: true
  - name: seznam
    disabled: true
  - name: naver
    disabled: false
  - name: mwmbl
    disabled: false
  - name: yep
    disabled: false
  - name: wiby
    disabled: false
  - name: bing
    disabled: true
  - name: yahoo
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: google cse
    disabled: true
  - name: qwant
    disabled: true
