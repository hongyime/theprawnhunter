use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

search:
  formats:
    - html
    - json
  safe_search: 0

server:
  limiter: false
  public_instance: false

# Datacenter-IP reality check (verified 2026-10-27): brave, duckduckgo, google cse,
# startpage and qwant all return CAPTCHA / 429 from this host. bing and yahoo work.
engines:
  - name: bing
    disabled: false
    weight: 1.2
  - name: yahoo
    disabled: false
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: google cse
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true
