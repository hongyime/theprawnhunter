name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
                  if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

            - name: Run Tests
              env:
                  PROJECT_NAME: "CI Test"
                  ENV: "test"
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                  REDIS_URL: "redis://localhost:6379/0"
                  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
                  MONITOR_BOT_TOKEN: ${{ secrets.MONITOR_BOT_TOKEN }}
                  MONITOR_GROUP_ID: ${{ secrets.MONITOR_GROUP_ID }}
                  MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
                  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
                  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
                  GH_OSINT_TOKEN: ${{ secrets.GH_OSINT_TOKEN }}
              run: |
                  pytest

    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Ruff
              run: python -m pip install ruff==0.1.9

            - name: Run Ruff
              run: ruff check .

    frontend:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: frontend
        env:
            NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_KEY: build-time-placeholder-key

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run tests and typecheck
              run: npm test

            - name: Run ESLint
              run: npm run lint

            - name: Build production frontend
              run: npm run build

    rls-smoke:
        # FE-002: verify anon key cannot read the raw discovered_credentials
        # table nor the newly-authenticated-only discovered_credentials_public
        # view. Runs on every push/PR against the live Supabase.
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs: [test]
        # Skip if secrets aren't set (fork PRs, first-run).
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        steps:
            - name: Anon key must be denied on discovered_credentials
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
              run: |
                  if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
                      echo "::warning::Secrets not configured for RLS smoke; skipping."
                      exit 0
                  fi
                  http=$(curl -s -o /tmp/body.json -w "%{http_code}" \
                      -H "apikey: $SUPABASE_KEY" \
                      -H "Authorization: Bearer $SUPABASE_KEY" \
                      "$SUPABASE_URL/rest/v1/discovered_credentials?select=id&limit=1")
                  # PostgREST returns 401/403 when RLS denies, or 200 with empty [] when
                  # the anon role has no matching policy — either is acceptable.
                  if [ "$http" -ge 400 ] && [ "$http" -lt 500 ]; then
                      echo "OK: anon denied with HTTP $http"
                      exit 0
                  fi
                  if [ "$http" = "200" ]; then
                      body=$(cat /tmp/body.json)
                      if [ "$body" = "[]" ]; then
                          echo "OK: anon received empty array (RLS-filtered)"
                          exit 0
                      fi
                      echo "::error::anon returned non-empty body — RLS is not filtering discovered_credentials"
                      head -c 200 /tmp/body.json
                      exit 1
                  fi
                  echo "::error::unexpected HTTP $http"
                  exit 1
