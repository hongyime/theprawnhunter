name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
                  if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

            - name: Run Tests
              env:
                  PROJECT_NAME: "CI Test"
                  ENV: "test"
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                  REDIS_URL: "redis://localhost:6379/0"
                  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
                  MONITOR_BOT_TOKEN: ${{ secrets.MONITOR_BOT_TOKEN }}
                  MONITOR_GROUP_ID: ${{ secrets.MONITOR_GROUP_ID }}
                  MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
                  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
                  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
                  GH_OSINT_TOKEN: ${{ secrets.GH_OSINT_TOKEN }}
              run: |
                  pytest

    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Ruff
              run: python -m pip install ruff==0.1.9

            - name: Run Ruff
              run: ruff check .

    frontend:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: frontend
        env:
            NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_KEY: build-time-placeholder-key

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run tests and typecheck
              run: npm test

            - name: Run ESLint
              run: npm run lint

            - name: Build production frontend
              run: npm run build
