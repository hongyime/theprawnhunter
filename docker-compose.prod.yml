# The Prawn Hunter — Production overlay (lean).
#
# Apply on top of the base file, enabling the extras you actually run:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full up -d --build
#
# Keeps the single-stack, single-worker design; only bumps concurrency/workers
# and flips runtime flags to production. Resources still come from .env defaults
# so prod stays lean unless you deliberately raise the *_CPUS / *_MEM_LIMIT knobs.
name: theprawnhunter

services:
  api:
    environment:
      - ENV=production
      - DEBUG=False
    command: >-
      gunicorn app.api.main:app
      -k uvicorn.workers.UvicornWorker
      -w ${API_WORKERS:-4}
      --bind 0.0.0.0:8001
      --timeout ${API_GUNICORN_TIMEOUT:-120}

  worker:
    command: >-
      celery -A app.workers.celery_app worker
      -Q celery,scanners,scrape,validation
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --concurrency=${WORKER_CONCURRENCY:-6}

  frontend:
    environment:
      - NODE_ENV=production
