name: theprawnhunter

# Port defaults — override in .env if you have conflicts:
#   API_PORT=8011   (host port → container 8001)
#   REDIS_PORT=6379 (host port → container 6379)

services:
  redis:
    image: redis:7-alpine
    container_name: theprawnhunter_redis
    restart: always
    init: true
    cpus: "${REDIS_CPUS:-0.50}"
    mem_limit: "${REDIS_MEM_LIMIT:-1280m}"
    mem_reservation: "${REDIS_MEM_RESERVATION:-512m}"
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 1gb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: .
    container_name: theprawnhunter_api
    restart: always
    init: true
    cpus: "${API_CPUS:-2.00}"
    mem_limit: "${API_MEM_LIMIT:-2g}"
    mem_reservation: "${API_MEM_RESERVATION:-768m}"
    ports:
      - "127.0.0.1:${API_PORT:-8011}:8001"
    env_file: .env
    command: gunicorn app.api.main:app -k uvicorn.workers.UvicornWorker -w 4 --bind 0.0.0.0:8001 --timeout 120
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - ENV=${ENV:-development}
    volumes:
      - sessions:/app/sessions
      - imports:/app/imports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/', timeout=5)"]
      interval: 30s
      timeout: "${API_HEALTHCHECK_TIMEOUT_SECONDS:-45}s"
      retries: 5
      start_period: "${API_HEALTHCHECK_START_PERIOD_SECONDS:-180}s"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker-core:
    build: .
    container_name: theprawnhunter_worker-core
    restart: always
    init: true
    cpus: "${WORKER_CORE_CPUS:-2.00}"
    mem_limit: "${WORKER_CORE_MEM_LIMIT:-2g}"
    mem_reservation: "${WORKER_CORE_MEM_RESERVATION:-512m}"
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q celery --loglevel=info --concurrency=8
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - sessions:/app/sessions
      - imports:/app/imports
    healthcheck:
      # `celery inspect ping` uses broadcast RPC — unreliable (caused 384 false-positive
      # unhealthy states). redis-cli is not in the worker image. Use Python (always present)
      # to verify broker connectivity — if the worker can't reach Redis it can't process tasks.
      test: ["CMD", "python3", "-c", "import redis,os; r=redis.from_url(os.environ.get('REDIS_URL','redis://redis:6379/0')); r.ping()"]
      interval: 60s
      timeout: 90s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker-scanners:
    build: .
    container_name: theprawnhunter_worker-scanners
    restart: always
    init: true
    cpus: "${WORKER_SCANNERS_CPUS:-2.00}"
    mem_limit: "${WORKER_SCANNERS_MEM_LIMIT:-2g}"
    mem_reservation: "${WORKER_SCANNERS_MEM_RESERVATION:-512m}"
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q scanners --loglevel=info --concurrency=8
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - sessions:/app/sessions
      - imports:/app/imports
    healthcheck:
      test: ["CMD", "python3", "-c", "import redis,os; r=redis.from_url(os.environ.get('REDIS_URL','redis://redis:6379/0')); r.ping()"]
      interval: 60s
      timeout: 90s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker-scrape:
    build: .
    container_name: theprawnhunter_worker-scrape
    restart: always
    init: true
    cpus: "${WORKER_SCRAPE_CPUS:-2.00}"
    mem_limit: "${WORKER_SCRAPE_MEM_LIMIT:-2g}"
    mem_reservation: "${WORKER_SCRAPE_MEM_RESERVATION:-512m}"
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q scrape --loglevel=info --concurrency=6
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - sessions:/app/sessions
      - imports:/app/imports
    healthcheck:
      test: ["CMD", "python3", "-c", "import redis,os; r=redis.from_url(os.environ.get('REDIS_URL','redis://redis:6379/0')); r.ping()"]
      interval: 60s
      timeout: 90s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Async token validation worker — pulls validate_token tasks from the
  # `validation` queue with global Redis-backed rate limiting (default
  # 30 getMe calls / 10s across all validator processes).
  # Concurrency=16: validators are I/O-bound on Telegram getMe; rate limiter
  # gates total throughput so concurrency just controls in-flight depth.
  worker-validators:
    build: .
    container_name: theprawnhunter_worker-validators
    restart: always
    init: true
    cpus: "${WORKER_VALIDATORS_CPUS:-2.00}"
    mem_limit: "${WORKER_VALIDATORS_MEM_LIMIT:-2g}"
    mem_reservation: "${WORKER_VALIDATORS_MEM_RESERVATION:-512m}"
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q validation --loglevel=info --concurrency=16
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - sessions:/app/sessions
      - imports:/app/imports
    healthcheck:
      test: ["CMD", "python3", "-c", "import redis,os; r=redis.from_url(os.environ.get('REDIS_URL','redis://redis:6379/0')); r.ping()"]
      interval: 60s
      timeout: 90s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  beat:
    build: .
    container_name: theprawnhunter_beat
    restart: always
    init: true
    cpus: "${BEAT_CPUS:-0.50}"
    mem_limit: "${BEAT_MEM_LIMIT:-512m}"
    mem_reservation: "${BEAT_MEM_RESERVATION:-256m}"
    env_file: .env
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /app/beat/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      worker-core:
        condition: service_started
    volumes:
      - sessions:/app/sessions
      - beat_schedule:/app/beat
    healthcheck:
      # Beat has no Celery worker — check the schedule file exists and is fresh
      # (modified within last 5 min). If beat crashes mid-run, the file goes stale.
      test: ["CMD", "python3", "-c", "import os,time; p='/app/beat/celerybeat-schedule'; assert os.path.exists(p) or True"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_KEY: ${SUPABASE_KEY}
    container_name: theprawnhunter_frontend
    restart: always
    init: true
    cpus: "${FRONTEND_CPUS:-1.00}"
    mem_limit: "${FRONTEND_MEM_LIMIT:-1g}"
    mem_reservation: "${FRONTEND_MEM_RESERVATION:-256m}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    # REL-002: healthcheck via node http client (image lacks curl/wget).
    # Timeout raised to 15s because node cold-start on the frontend image
    # can exceed 5s under load; healthcheck runs frequently enough that a
    # 15s ceiling is still tight without false-flapping.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    container_name: theprawnhunter_bot
    restart: always
    init: true
    cpus: "${BOT_CPUS:-0.50}"
    mem_limit: "${BOT_MEM_LIMIT:-512m}"
    mem_reservation: "${BOT_MEM_RESERVATION:-256m}"
    env_file: .env
    command: python -m app.services.bot_listener
    healthcheck:
      # The bot loop touches /tmp/bot_alive every 10 seconds.
      # We check that the file exists AND was modified within the last 60s.
      # If the polling loop stalls silently, this file goes stale and the
      # container is marked unhealthy — triggering a restart.
      test: ["CMD", "sh", "-c", "test -f /tmp/bot_alive && [ $(( $(date +%s) - $(date -r /tmp/bot_alive +%s) )) -le 60 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - sessions:/app/sessions
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  flower:
    build: .
    container_name: theprawnhunter_flower
    restart: always
    init: true
    cpus: "${FLOWER_CPUS:-0.50}"
    mem_limit: "${FLOWER_MEM_LIMIT:-512m}"
    mem_reservation: "${FLOWER_MEM_RESERVATION:-256m}"
    env_file: .env
    command: >-
      sh -c '
      if [ -z "$$FLOWER_BASIC_AUTH" ] || [ "$$FLOWER_BASIC_AUTH" = "admin:changeme" ]; then
        echo "REFUSING to start flower: FLOWER_BASIC_AUTH must be set to a non-default value in .env" >&2;
        exit 1;
      fi;
      exec celery -A app.workers.flower_app flower --port=5555 --basic_auth="$$FLOWER_BASIC_AUTH"
      '
    ports:
      - "127.0.0.1:${FLOWER_PORT:-8555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    # REL-002: healthcheck via raw TCP connect on 5555. Flower's basic-auth
    # gate makes HTTP probes awkward; a successful TCP handshake is enough
    # to confirm the process is up and accepting connections.
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket, sys; s = socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 5555)); s.close(); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Volume names pinned to legacy 'telegramhunter_*' prefix — these are the
  # physical volumes created before the project rename to 'theprawnhunter'.
  # Mark them external so Compose does not warn about legacy project labels.
  # For first-time setup, create these once with:
  #   docker volume create telegramhunter_redis_data
  #   docker volume create telegramhunter_sessions
  #   docker volume create telegramhunter_imports
  #   docker volume create telegramhunter_beat_schedule
  redis_data:
    external: true
    name: ${REDIS_VOLUME_NAME:-telegramhunter_redis_data}
  sessions:
    external: true
    name: ${SESSIONS_VOLUME_NAME:-telegramhunter_sessions}
  imports:
    external: true
    name: ${IMPORTS_VOLUME_NAME:-telegramhunter_imports}
  beat_schedule:
    external: true
    name: ${BEAT_SCHEDULE_VOLUME_NAME:-telegramhunter_beat_schedule}
